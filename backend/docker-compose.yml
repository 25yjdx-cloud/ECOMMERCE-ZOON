name: commerceforge

services:
  db:
    image: mysql:8.0.46@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
    container_name: commerceforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.docker}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - commerceforge-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    image: cf-php-bagisto:8.3
    container_name: commerceforge-backend
    working_dir: /workspace
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: "4"
      STOREFRONT_URL: http://localhost:3006
      STOREFRONT_ORIGIN: http://localhost:3006
      COMMERCEFORGE_PRESET_REGISTRY: /commerceforge-presets.json
    volumes:
      - ./bagisto:/workspace:cached
      - bagisto-vendor:/workspace/vendor
      - ../config/templates/presets.json:/commerceforge-presets.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction --prefer-dist --optimize-autoloader
        fi
        cd public
        exec php \
          -d opcache.enable=1 \
          -d opcache.enable_cli=1 \
          -d opcache.memory_consumption=256 \
          -d opcache.max_accelerated_files=20000 \
          -d opcache.validate_timestamps=1 \
          -d opcache.revalidate_freq=10 \
          -S 0.0.0.0:8000 \
          /workspace/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php

volumes:
  bagisto-vendor:
  commerceforge-mysql:
